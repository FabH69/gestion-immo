<div class="champ">{% if champ.widget_type == "checkbox" %}<label class="case" for="{{ champ.id_for_label }}">{{ champ }} {{ champ.label }}</label>{% elif champ.widget_type == "radioselect" %}<span class="titre">{{ champ.label }}</span>{{ champ }}{% else %}{{ champ.label_tag }}{{ champ }}{% endif %}{% if champ.help_text %}<div class="aide">{{ champ.help_text }}</div>{% endif %}{% for e in champ.errors %}<div class="erreur">{{ e }}</div>{% endfor %}</div>
