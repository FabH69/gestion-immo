<form method="post" action="{% url 'balles:ligne_action' l.pk %}" class="inline">{% csrf_token %}
  <input type="hidden" name="action" value="{{ action }}">
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  {% if actif %}<button class="btn petit ok">✔ Oui</button>{% else %}<button class="btn petit sec">Non</button>{% endif %}
</form>
