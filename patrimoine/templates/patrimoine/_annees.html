<div class="groupe-filtre annees" role="group" aria-label="Année">{% for b in boutons %}<a href="{{ b.url }}" class="chip{% if b.actif %} actif{% endif %}">{{ b.libelle }}</a>{% endfor %}</div>
{% if anterieures %}<label class="filtre-select{% if anterieure_active %} actif{% endif %}"><span>Années antérieures</span>
  <select onchange="if(this.value)window.location.href=this.value"><option value="">–</option>{% for a in anterieures %}<option value="{{ a.url }}"{% if a.actif %} selected{% endif %}>{{ a.libelle }}</option>{% endfor %}</select></label>{% endif %}
