<form method="post" action="{% url 'bloquer_saisie_bien' %}" class="bloquer-bien{% if blocage %} bloque{% endif %}">{% csrf_token %}<input type="hidden" name="bien" value="{{ bien.pk }}"><input type="hidden" name="annee" value="{{ annee }}"><input type="hidden" name="retour" value="{{ request.get_full_path }}">{% if blocage %}<input type="hidden" name="action" value="debloquer"><span class="etat">🔒 Saisie bloquée le {{ blocage.bloquee_le|date:"d/m/Y" }}</span> <button type="submit" class="lien" onclick="return confirm('Débloquer rouvre la saisie {{ annee }} de {{ bien.nom|escapejs }}. Continuer ?')">Débloquer</button>{% else %}<input type="hidden" name="action" value="bloquer"><button type="submit" class="button" title="Fige les factures {{ annee }} de ce bien et les attestations de ses prêts">🔓 Bloquer la saisie</button>{% endif %}</form>
