<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  @page { size: A4 landscape; margin: 1.2cm; @bottom-right { content: "Page " counter(page) " / " counter(pages); font-size: 7pt; color: #777; } }
  body { font-family: "DejaVu Sans", sans-serif; font-size: 7pt; color: #222; }
  h1 { font-size: 13pt; margin: 0 0 3pt; }
  .sous-titre { color: #555; margin-bottom: 10pt; }
  {% include "patrimoine/_style_etat.css" %}
  table.etat th, table.etat td { padding: 3pt 3pt; }
  tr { page-break-inside: avoid; }
</style></head>
<body>
  <h1>État des loyers encaissés – année {{ annee }}</h1>
  <div class="sous-titre">{% if proprietaire %}{{ proprietaire.nom }}{% else %}Toutes entités{% endif %} · montants en euros, par date d'encaissement · édité le {{ aujourdhui|date:"d/m/Y" }}</div>
  {% include "patrimoine/_tableau_etat.html" %}
</body></html>
