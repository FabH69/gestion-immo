{% if maisons|length > 1 %}<form method="get" class="choix-maison"><select name="bien" class="choix-dossier-d" onchange="this.form.submit()" aria-label="Maison">
  {% for b in maisons %}<option value="{{ b.pk }}"{% if b == bien %} selected{% endif %}>{{ b.nom }}</option>{% endfor %}
</select><noscript><button class="button">Afficher</button></noscript></form>{% endif %}
