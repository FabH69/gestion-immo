{% if taches %}
<div class="module" style="margin-bottom:20px">
  <table style="width:100%">
    <caption><a href="{% url 'admin:patrimoine_tache_changelist' %}?quand=30j" class="section">Changements de locataire : tâches des 30 prochains jours</a></caption>
    {% for t in taches %}
    <tr>
      <td style="white-space:nowrap;{% if t.echeance < aujourdhui %}color:#c62828;font-weight:bold{% endif %}">{{ t.echeance|date:"d/m/Y" }}</td>
      <th scope="row"><a href="{% url 'admin:patrimoine_changementlocataire_change' t.changement_id %}">{{ t.libelle }}</a></th>
      <td>{{ t.changement.lot }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endif %}
